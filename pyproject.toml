[project]
name = "agent-deepseek"
version = "0.1.0"
description = "Agent DeepSeek - Open-source, self-hostable full-stack Agent web platform"
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "argon2-cffi>=25.1.0",
    "email-validator>=2.3.0",
    "fastapi>=0.121.2",
    "fastapi-cache2[redis]>=0.2.2",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "orjson>=3.11.7",
    "passlib>=1.7.4",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "pyjwt>=2.12.1",
    "starlette==0.52.1",
    "tortoise-orm>=0.25.4",
    "uvicorn>=0.42.0",
    "setuptools>=69.5.1",
    "alibabacloud-dysmsapi20170525>=3.1.0",
    "alibabacloud-dypnsapi20170525>=2.0.0",
    "langchain>=0.3.18",
    "langchain-community>=0.3.17",
    "langgraph>=0.2.0",
    "langserve>=0.3.0",
    "langchain-ollama>=0.2.0",
    "langchain-openai>=0.3.0",
    "sse-starlette>=2.0.0",
    "dashscope>=1.20.0",
    "charset-normalizer>=3.4.4",
    "numpy>=2.2.6",
    "openpyxl>=3.1.5",
    "pypdf>=4.0.0",
    "pyyaml>=6.0.2",
    "deepagents>=0.7.3",
    "seekdb-cli>=0.1.3",
    "pyseekdb>=1.1.0.post3",
    "aiomysql>=0.2.0",
    "langgraph-checkpoint-mysql[aiomysql]>=3.0.0",
    "aiosqlite>=0.20.0",
    "python-multipart>=0.0.20",
    "python-dotenv>=1.2.0",
    "langchain-mcp-adapters>=0.3.0",
    "langmem>=0.0.20",
    "apscheduler>=3.10.4",
    "anthropic>=0.96.0",
    "crawl4ai>=0.9.0",
    "langextract[openai]>=1.6.0",
    "watchfiles>=1.2.0",
    # DeepSeek Harness 官方 Python SDK（子进程驱动 dsh 运行时）。
    # 官方 PyPI 发布是手工流（无 python-v* tag → 0.1.2a2 不在 PyPI 上），故锁到本地构建的
    # vendored wheel（源码 = GitHub tag dsh-v0.1.2-alpha.2）：
    #   - deepseek_harness_sdk-0.1.2a2：SDK 本体
    #   - deepseek_harness_runtime_bin-0.1.2a2：桩轮（无 bundled exe；运行载体是 npm 全局
    #     @deepseek-ai/dsh@0.1.2-alpha.5，经 SDK 的 dsh_bin 参数传入；桩只满足 SDK 强制依赖声明）。
    # 启动机制已变：profile + --patch + 强制 DSH_HOME（旧 DSH_CORDIS_CONFIG/DSH_SESSION_ROOT 已删）。
    # dsh 处于 developer preview，升级走回归；部署镜像需 npm 载体 + Node>=22.19（见 deploy）。
    # 0.1.2-alpha.3 起载体补齐 Windows 支持（tool-pwsh/pwsh-sandbox 行），SDK 是纯 Python，
    # 全平台可装（原 `; sys_platform != 'win32'` 排除已移除；Windows 启动适配见 qa_agent.py）
    "deepseek-harness-sdk @ file:///${PROJECT_ROOT}/vendor/wheels/deepseek_harness_sdk-0.1.2a2-py3-none-any.whl",
    "deepseek-harness-runtime-bin @ file:///${PROJECT_ROOT}/vendor/wheels/deepseek_harness_runtime_bin-0.1.2a2-py3-none-any.whl",
    "paramiko>=5.0.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pyright]
include = ["app"]
exclude = [
    "web",
    ".venv",
    "**/.*",
    "**/__pycache__",
    "**/node_modules",
    "src/experimental",
    "src/typestubs",
]
pythonVersion = "3.12"
pythonPlatform = "All"
defineConstant = { PYDANTIC_V2 = true }
executionEnvironments = [
  { root = "./tests/python_3_12", pythonVersion = "3.12", extraPaths = [
    "./",
  ] },
  { root = "./tests", extraPaths = [
    "./",
  ] },
  { root = "./" },
]

typeCheckingMode = "standard"
reportShadowedImports = false
disableBytesTypePromotions = true

[dependency-groups]
dev = [
    "ruff>=0.16.3",
    "pytest>=8.0",
]
