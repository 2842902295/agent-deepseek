gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types text/plain text/css text/xml text/javascript
           application/json application/javascript application/xml
           application/x-javascript image/svg+xml font/woff2;

# 内网 IP/localhost 直接访问（HTTP，默认 server）
server {
        listen 80 default_server;
        server_name localhost;
        client_max_body_size 1000m;

        add_header X-Frame-Options SAMEORIGIN;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";

        location ~* \.(?:js|css|woff2?|ttf|ico|png|jpg|jpeg|gif|svg|webp)$ {
              root /var/www/html/fast-soy-admin;
              expires 1y;
              add_header Cache-Control "public, immutable";
              access_log off;
        }

        location / {
              root /var/www/html/fast-soy-admin;
              index index.html index.htm;
              try_files $uri /index.html;
              add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        location ^~ /api/ {
                proxy_pass http://app:9999;
                proxy_set_header Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_connect_timeout 7200s;
                proxy_read_timeout 7200s;
                proxy_send_timeout 7200s;
                proxy_buffering off;
                proxy_cache off;
        }
}

# 域名访问：HTTP 强制跳转 HTTPS
server {
        listen 80;
        server_name agent-deepseek.com www.agent-deepseek.com;
        return 301 https://$host$request_uri;
}

# HTTPS（域名访问）
server {
        listen 443 ssl;
        server_name agent-deepseek.com www.agent-deepseek.com;
        client_max_body_size 1000m;

        ssl_certificate     /etc/nginx/ssl/agent-deepseek.com_ca.crt;
        ssl_certificate_key /etc/nginx/ssl/agent-deepseek.com.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options SAMEORIGIN;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";

        location ~* \.(?:js|css|woff2?|ttf|ico|png|jpg|jpeg|gif|svg|webp)$ {
              root /var/www/html/fast-soy-admin;
              expires 1y;
              add_header Cache-Control "public, immutable";
              access_log off;
        }

        location / {
              root /var/www/html/fast-soy-admin;
              index index.html index.htm;
              try_files $uri /index.html;
              add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        location ^~ /api/ {
                proxy_pass http://app:9999;
                proxy_set_header Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_connect_timeout 7200s;
                proxy_read_timeout 7200s;
                proxy_send_timeout 7200s;
                proxy_buffering off;
                proxy_cache off;
        }
}